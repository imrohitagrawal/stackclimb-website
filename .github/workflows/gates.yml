name: gates

# The first mechanical enforcement this repo has had. Until now every rule in
# AGENTS.md was influence: nothing stopped a push that broke one.
#
# Order matters. The cheap checks that protect the owner run first, so a commit
# carrying a phone number or a secret fails in seconds rather than after a
# five-minute browser install.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: >
          DEF-4. Regenerate tests/visual-baselines.spec.js-snapshots/ on this
          runner's image and upload them as an artifact. Never hand-generate
          baselines on a laptop — a different OS renders different pixels, so
          a locally-made baseline would fail on every real CI run.
        type: boolean
        default: false
      update_geometry_baseline:
        description: >
          DEF-54. Regenerate tests/geometry-baseline.linux.json on this
          runner and upload it as an artifact. This is the ONLY way to refresh
          the committed baseline. Measured, not assumed: a darwin baseline and
          a linux one at the same commit differ on 148 of 828 keys by up to
          42px, because the two systems rasterize the same self-hosted fonts to
          different advance widths and the text wraps in different places.
        type: boolean
        default: false

permissions:
  contents: read
  # gitleaks-action calls GET /repos/{o}/{r}/pulls/{n}/commits on a
  # pull_request event. With contents:read alone that returns 403 "Resource
  # not accessible by integration" and the whole job dies. DEF-39: the
  # workflow had only ever run on push, so the PR path — the one branch
  # protection actually gates on — had never been exercised.
  pull-requests: read

jobs:
  secrets-and-pii:
    name: secrets and personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip. A secret committed and
          # then "removed" in a later commit is still in the pack file and
          # still retrievable, so a shallow clone would report it clean.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # DEF-37 review round 2: this job runs `node tests/no-pii.mjs`, and once
      # extract-text.mjs started importing pdf-parse/mammoth for the PDF/DOCX
      # scan, that import needs node_modules. Before this PR the PII gate had
      # zero external dependencies, so no `npm ci` was needed here — that
      # stopped being true the moment this PR landed, and the job crashed
      # with ERR_MODULE_NOT_FOUND before it could scan anything. The other
      # job's `npm ci` does not help; jobs run in separate, unshared runners.
      - run: npm ci

      - name: .env must never be tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. It must be gitignored; only .env.example ships."
            exit 1
          fi
          echo "ok: .env is not tracked"

      - name: the inbox must never be tracked
        run: |
          # assets/inbox/ holds owner-supplied source material. Three times it
          # has carried personal contact details: visiting cards with a mobile
          # number and a LinkedIn QR as pixels, and a CV with a phone number.
          tracked=$(git ls-files 'assets/inbox/' | grep -v '^assets/inbox/README.md$' | grep -v '\.gitkeep$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::files tracked under assets/inbox/ — it is staging and must stay untracked"
            echo "$tracked"
            exit 1
          fi
          echo "ok: inbox is untracked"

      # DEF-39, second half. This step used to run AFTER gitleaks, which
      # contradicted the header comment above it — "the cheap checks that
      # protect the owner run first". It mattered: when gitleaks 403'd on the
      # first pull_request run, the job died before this ever executed, so the
      # gate D39 exists to enforce silently did not run. A gate that can be
      # skipped by an unrelated step failing upstream is not enforcement.
      # It needs no network and no token, so nothing can stop it but a real hit.
      - name: personal contact details (D38)
        run: |
          node tests/no-pii.mjs --self-test
          node tests/no-pii.mjs

      # DEF-47: the D8 file budget held only in prose, and global.css grew to
      # 505 against its recorded ceiling of 500 with nobody noticing. AGENTS.md's
      # own rule — if it must ALWAYS hold, it lives in CI, not in a doc.
      # Needs no build and no browser, so it belongs with the cheap checks.
      - name: file budget (D8)
        run: |
          node tests/file-budget.mjs --self-test
          node tests/file-budget.mjs

      # DEF-54: the geometry gate took over PRECISION from the screenshot gate.
      # Both still block; the screenshot gate stays blocking as a coarse
      # catastrophe net, so this is a change of job, not a handover of the
      # ability to fail the build. The comparison is a pure function, so it can
      # prove it bites without a browser, a build, or a server — which is why it
      # runs here in the cheap job rather than only inside `npx playwright test`
      # below. The gate that blocks layout changes should not be the one gate
      # nobody has proved can fail. It takes no --self-test flag: a Playwright
      # spec cannot receive argv, so the self-test is its own entry point and a
      # flag would be inert. post-deploy.mjs --self-test used to be the counter-
      # example named here — present, and wired nowhere. It is DEF-57, and it is
      # now the step below this one.
      #
      # DEF-60 rides in the same entry point: geometry-selftest.mjs also proves
      # the row-population floor in tests/lib/geometry-floor.mjs, and its
      # partner. The floor is the number that stays red after a baseline
      # REGENERATION, which is the one moment a predicate-derived row can leave
      # the gate quietly.
      - name: geometry gate bites (DEF-54, DEF-60)
        run: node tests/geometry-selftest.mjs

      # DEF-57: `tests/post-deploy.mjs --self-test` shipped on 2026-08-11 in
      # commit 111c978, and no automation ran it once in the fourteen days
      # since. It guards the ONLY check in this repo that looks at production,
      # and it was the one self-test of four that nobody had watched fail — a
      # check that has never run has proven nothing.
      #
      # It belongs in this job for the same reason as the three steps above: it
      # needs no build, no browser and no network. Its fixtures are local
      # `node:http` servers on ephemeral ports, and the `--self-test` branch
      # exits before it ever reads dist/, so it runs with nothing built. ~8s,
      # almost all of it the deliberate 3-attempt N-of-M retry spacing.
      #
      # Proved to bite before being wired, not after: neutering the srcset
      # branch of assetRefs() turns 2 checks red, and accepting a non-200 as a
      # healthy asset turns 3 red — including the 2026-08-11 404 this whole file
      # exists for.
      - name: the production gate bites (DEF-57)
        run: node tests/post-deploy.mjs --self-test

      # DEF-59: the committed baselines — the geometry JSON and the 60 linux
      # PNGs — were protected only by a sentence in a file header. On Linux the
      # documented local regeneration command wrote the committed authority,
      # and the run did not even look wrong, because geometry.spec.js skips its
      # comparisons while UPDATE_GEOMETRY is set. The guard now refuses that
      # write; this step is what proves the guard can still fail.
      #
      # It has to be a self-test rather than a normal gate, because the guard's
      # job is to refuse a write on a LAPTOP and a runner is the one machine it
      # always lets through. Left unproved it would have been exactly DEF-57
      # again — a self-test wired into nothing, which is the defect fixed by the
      # step above and no longer an open one. Runs here, before gitleaks, for DEF-39's
      # reason: a check that an unrelated upstream failure can skip is not
      # enforcement. Costs no build, no browser, and no network.
      - name: baselines cannot be written outside CI (DEF-59)
        run: node tests/baseline-guard-selftest.mjs

      # DEF-62: `core.hooksPath` was an ABSOLUTE path in `.git/config`, a file
      # git never clones. The pre-commit hook therefore ran on exactly one
      # laptop and in exactly one working tree, while `docs/STATUS.md` row M4
      # and directive W-6 both said it was done. The `prepare` script in
      # package.json is the fix; this step is what proves it, by building a
      # throwaway repo and attempting real commits through the real hook.
      #
      # Same reasoning as the two steps above, and the same reason it runs
      # here: it needs no build, no browser and no network, and a check an
      # unrelated upstream failure can skip is not enforcement (DEF-39). It is
      # wired in the same change that adds it, so it does not become a second
      # DEF-57 — the self-test that was wired into nothing, now fixed and
      # running two steps above this one.
      #
      # The `npm ci` at the top of this job now runs `prepare` on the runner
      # too, which sets core.hooksPath here. Nothing in CI commits, so that has
      # no effect; it is the same command every developer's install runs, which
      # is the point.
      - name: the pre-commit hook binds on every clone (DEF-62)
        run: node tests/hook-binding-selftest.mjs

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: build, test, and scan the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # DEF-11: the suite used to test whatever dist/ happened to hold. It
      # builds first here, so a green run means the code in this commit is
      # what was tested.
      - run: npm run build

      - name: no personal data in the BUILD, not just the source
        run: node tests/no-pii.mjs

      - run: npx playwright install --with-deps chromium

      # Skipped only on the manual baseline-generation run below: with no
      # baselines committed yet, this step would fail on "snapshot doesn't
      # exist" before it ever got a chance to create them.
      - name: run the test suite
        if: "!(github.event_name == 'workflow_dispatch' && (inputs.update_visual_baselines || inputs.update_geometry_baseline))"
        run: npx playwright test

      # DEF-54. Manual-only. --workers=1 is not optional: parallel workers are
      # separate processes, and the last one to write the file would silently
      # drop the others' legs — a truncated baseline that then passes
      # vacuously. The spec throws if the flag is missing rather than trusting
      # the operator to remember it.
      - name: regenerate the geometry baseline (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.update_geometry_baseline
        env:
          UPDATE_GEOMETRY: '1'
        run: npx playwright test tests/geometry.spec.js --workers=1

      - name: upload the regenerated geometry baseline
        if: github.event_name == 'workflow_dispatch' && inputs.update_geometry_baseline
        uses: actions/upload-artifact@v4
        with:
          name: geometry-baseline
          path: tests/geometry-baseline.linux.json
          retention-days: 14

      # DEF-4. Manual-only: run with the "update_visual_baselines" input to
      # regenerate tests/visual-baselines.spec.js-snapshots/ on this exact
      # image, then download the artifact below and commit only those files.
      # Never generate them on a laptop — a different OS renders different
      # pixels, and toHaveScreenshot names the file with process.platform, so
      # a laptop-made baseline would not even be the file CI looks for.
      #
      # Runs BEFORE the two steps below, not after: both of those background
      # an `astro preview` on port 4321 and never kill it, so this step's own
      # playwright-managed webServer would hit EADDRINUSE if it ran later.
      - name: regenerate visual baselines (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        # `--update-snapshots` alone presets to "changed", which asks the SAME
        # comparison that DEF-54 shows is blind at desktop width whether a file
        # needs rewriting. A baseline that is wrong but sits inside
        # MAX_DIFF_PIXEL_RATIO is therefore never refreshed by this step — that is
        # how plate-contact-1440 came back byte-identical while the plate had
        # gained a whole button. `=all` makes regeneration actually regenerate.
        # Commit only the files whose PIXELS changed; most come back merely
        # re-encoded (56 of 60 on the D112 run), which is D111's trap.
        run: npx playwright test tests/visual-baselines.spec.js --update-snapshots=all

      - name: upload regenerated visual baselines
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual-baselines.spec.js-snapshots/
          retention-days: 14

      - name: plate seams stay above AA
        run: |
          npx astro preview --port 4321 &
          npx wait-on http://localhost:4321 -t 30000
          node tests/boundary-check.mjs http://localhost:4321

      # RCA-003. The other three contrast checks are all structurally blind to
      # the fixed nav: axe scopes to .plate, boundary-check samples plate seams,
      # and axe's contrast rule reads the DOM where a background-less fixed bar
      # computes to transparent. This one samples rendered pixels at every
      # scroll position. Before the fix it reported 22 of 48 desktop positions
      # below AA at 1.00:1 while all three others were green.
      - name: the fixed nav stays readable over every plate
        run: node tests/nav-contrast.mjs http://localhost:4321

  # ═══════════════════════════════════════════════════════════════════════════
  # APPROACH C. The standing debt at the top of AGENTS.md says deployment runs
  # through CI so nothing reaches production without passing the gates, and
  # nothing sits merged-but-undeployed without something saying so. Every row of
  # that exit table now reads done, so this is the migration itself.
  #
  # It replaces a manual `npx wrangler pages deploy` typed by a person. That is
  # how, on 2026-08-11, a deploy printed "Success! Uploaded 13 files (20 already
  # uploaded)" and shipped a 404: Cloudflare's dedup claimed a blob it did not
  # hold and wrangler never reads back what it skips. Nothing was watching.
  #
  # `needs:` both gate jobs, so a red gate cannot deploy. `if:` restricts it to
  # a push on main, so a PR build never touches production.
  #
  # DEPENDS ON ONE SECRET: CLOUDFLARE_API_TOKEN, scoped to "Cloudflare Pages —
  # Edit" for this account. If it ever goes missing, the deploy steps below
  # are skipped but this JOB still fails (DEF-53) — a skipped deploy must
  # never report the same green conclusion as a real one. Deploy is not a
  # required branch-protection check, so this cannot block a merge.
  deploy:
    name: deploy to production, then verify production
    runs-on: ubuntu-latest
    needs: [secrets-and-pii, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Announce the missing secret loudly. A skipped deploy that looks like a
      # passed deploy is the exact failure this whole job exists to prevent.
      - name: check the deploy credential exists
        id: cred
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — SKIPPING deploy. Production is NOT updated by this run. Approach A' (manual wrangler) still applies until the secret exists."
            echo "### Deploy skipped — no \`CLOUDFLARE_API_TOKEN\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Production was **not** updated by this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: build
        if: steps.cred.outputs.have == 'true'
        run: npm run build

      - name: deploy to Cloudflare Pages
        if: steps.cred.outputs.have == 'true'
        run: npx wrangler pages deploy dist --project-name=stackclimb --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A Pages-Edit-scoped token cannot enumerate accounts, so wrangler
          # needs the id passed explicitly. First CI deploy (run 31739608605)
          # failed on exactly this: "Failed to automatically retrieve account
          # IDs for the logged in user."
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The deploy is not the check. wrangler reported Success on the run that
      # shipped a 404, so this fetches production and every asset it references.
      # A settle wait first, because a CDN needs a moment and correction row 281
      # requires one — a post-deploy gate that goes red one run in three is
      # worse than no gate.
      - name: verify production serves this build
        if: steps.cred.outputs.have == 'true'
        run: |
          sleep 20
          node tests/post-deploy.mjs

      # DEF-53: a skipped deploy must not report the same green conclusion as
      # a real one. The warning above is easy to miss in a run list; a failed
      # job is not. Deploy is not a required branch-protection check (only the
      # two gate jobs are), so this cannot block a merge — it only stops a
      # missing-secret run from looking identical to a real deploy.
      - name: fail if the deploy was skipped
        if: steps.cred.outputs.have != 'true'
        run: |
          echo "::error::Deploy skipped — CLOUDFLARE_API_TOKEN is missing. Failing this job on purpose so it cannot be mistaken for a real deploy."
          exit 1
